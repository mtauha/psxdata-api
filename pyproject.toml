[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psxdata-api"
version = "0.2.0"
description = "FastAPI REST service for Pakistan Stock Exchange (PSX) data"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.md"}
dependencies = [
    "psxdata==1.1.0",
    "fastapi[standard]>=0.100",
    "uvicorn[standard]>=0.23",
    "slowapi>=0.1",
    "redis>=4.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pytest-asyncio",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.0",
]

[tool.fastapi]
entrypoint = "api.main:app"

[project.urls]
Homepage = "https://github.com/mtauha/psxdata-api"
Source = "https://github.com/mtauha/psxdata-api"
"Bug Tracker" = "https://github.com/mtauha/psxdata-api/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
