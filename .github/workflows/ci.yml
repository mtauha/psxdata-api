name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check api/
      - name: Run mypy
        run: mypy api/

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/api/ -v --tb=short

  docs-smoketest:
    name: docs-smoketest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Start FastAPI
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/health > /dev/null && break
            sleep 1
          done
      - name: Smoke test /docs
        run: curl -f http://localhost:8000/docs
      - name: Smoke test /redoc
        run: curl -f http://localhost:8000/redoc
