name: Deploy
run-name: "Deploy ${{ github.ref_name }} to FastAPI Cloud"

# Deploys to FastAPI Cloud with a deploy token when a GitHub release is published.
# Needs repo secrets FASTAPI_CLOUD_TOKEN (deploy token) and FASTAPI_CLOUD_APP_ID.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: fastapi-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install FastAPI Cloud CLI
        run: pip install "fastapi[standard]"
      - name: Deploy to FastAPI Cloud
        run: fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
